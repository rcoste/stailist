<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="color-scheme" content="light only">
  <title>Tu c&oacute;digo de acceso a stailist</title>
  <style>
    body { margin: 0; padding: 0; width: 100% !important; }
    a { text-decoration: none; }
  </style>
</head>
<!-- Branding v3 "Gen-Z monocromo": Helvetica/Arial (sans) + Georgia it&aacute;lica de
     acento, wordmark st&middot;ai&middot;list con el "ai" en serif it&aacute;lica NEGRA (nunca
     burdeos), papel hueso #f4f3f1. Sin Bodoni Moda ni Hanken Grotesk (v2). Las
     fuentes propias no viajan fiables en correo (Gmail las ignora); usamos
     web-safe, igual que los correos de invitaci&oacute;n y semanal. -->
<body style="margin:0;padding:0;background:#f4f3f1;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Helvetica,Arial,sans-serif;color:#141414;">
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;opacity:0;font-size:1px;line-height:1px;color:#f4f3f1;">
    Tu c&oacute;digo de 6 d&iacute;gitos para entrar a stailist.
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f3f1;">
    <tr>
      <td align="center" style="padding:44px 20px 40px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:480px;">

          <tr><td style="padding:0 6px 20px;border-bottom:1px solid #e4e3e0;">
            <span style="font-size:24px;font-weight:700;letter-spacing:-0.045em;color:#141414;line-height:1;">st<span style="font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:400;letter-spacing:0;">ai</span>list</span>
          </td></tr>

          <tr><td style="padding:32px 6px 0;">
            <span style="font-size:11px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:#6f6f6f;">Tu acceso</span>
          </td></tr>

          <tr><td style="padding:14px 6px 0;">
            <h1 style="margin:0;font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-0.035em;color:#141414;">Ya casi est&aacute;s <span style="font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:400;letter-spacing:0;">dentro</span>.</h1>
          </td></tr>

          <tr><td style="padding:18px 6px 0;">
            <p style="margin:0;font-size:16px;line-height:1.6;color:#363636;">Teclea este c&oacute;digo en stailist para entrar:</p>
          </td></tr>

          <tr><td style="padding:20px 6px 0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0a0a0a;border-radius:6px;">
              <tr><td style="padding:22px 16px;text-align:center;font-size:34px;font-weight:700;letter-spacing:0.28em;color:#ffffff;">{{ .Token }}</td></tr>
            </table>
          </td></tr>

          <tr><td style="padding:20px 6px 0;">
            <p style="margin:0;font-size:13px;line-height:1.55;color:#9a9a9a;">El c&oacute;digo caduca en una hora. &iquest;No fuiste t&uacute;? Ign&oacute;ralo sin bronca &mdash; sin el c&oacute;digo nadie entra.</p>
          </td></tr>

          <tr><td style="padding:30px 6px 0;">
            <p style="margin:0;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:17px;line-height:1.5;color:#363636;">Nos vemos en tu cl&oacute;set.</p>
            <p style="margin:6px 0 0;font-size:13px;font-weight:700;letter-spacing:-0.01em;color:#141414;">&mdash; stailist</p>
          </td></tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
